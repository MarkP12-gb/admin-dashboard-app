<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoAuto — Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  function loadScriptWithFallback(urls){
    return new Promise(function(resolve, reject){
      var i = 0;
      function tryNext(){
        if(i >= urls.length){ reject(new Error('All CDN sources failed for: ' + urls[0])); return; }
        var s = document.createElement('script');
        s.src = urls[i];
        s.onload = resolve;
        s.onerror = function(){ i++; tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    });
  }
  window.__moauto_libsReady = Promise.all([
    loadScriptWithFallback(['https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js','https://unpkg.com/react@18/umd/react.production.min.js']),
    loadScriptWithFallback(['https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js','https://unpkg.com/react-dom@18/umd/react-dom.production.min.js']),
    loadScriptWithFallback(['https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js','https://unpkg.com/@babel/standalone/babel.min.js']),
    loadScriptWithFallback(['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js']),
    loadScriptWithFallback(['https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js','https://unpkg.com/chart.js@4/dist/chart.umd.min.js'])
  ]);
</script>
<style>
  :root{
    --bg:#F5F5F5; --panel:#FFFFFF; --panel-2:#ECEFF1; --line:#CFD8DC;
    --amber:#FFC107; --amber-dim:#C9960A; --teal:#0D47A1; --red:#D32F2F;
    --text:#1A1A1A; --text-dim:#455A64; --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#0F1720; --panel:#16202C; --panel-2:#1C2833; --line:#334455;
    --text:#ECEAE6; --text-dim:#9BA0AC;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;margin:0;}
  .app-shell{max-width:1100px;margin:0 auto;width:100%;min-height:100vh;padding:20px;}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);object-fit:contain;padding:3px;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
  .brand-tag{font-size:12px;color:var(--text-dim);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .stat-value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--teal);}
  .stat-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;margin-top:4px;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:28px 0 12px;}
  label{display:block;font-size:13px;color:var(--text-dim);margin:10px 0 6px;}
  input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:15px;}
  .btn{width:100%;padding:13px;border-radius:10px;border:none;font-weight:600;font-size:15px;cursor:pointer;}
  .btn-primary{background:var(--amber);color:#14171C;}
  .error-text{color:var(--red);font-size:13px;margin-top:8px;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;padding:10px 8px;color:var(--text-dim);font-size:12px;text-transform:uppercase;border-bottom:1px solid var(--line);}
  td{padding:10px 8px;border-bottom:1px solid var(--line);}
  .pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .pill-active{background:rgba(13,71,161,0.12);color:var(--teal);}
  .pill-expired{background:rgba(211,47,47,0.12);color:var(--red);}
  .hint{color:var(--text-dim);font-size:13px;}
  .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,0.15);border-top-color:var(--amber);border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;height:280px;}
</style>
</head>

<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('moauto_theme') || 'light');
</script>
<script type="text/plain" id="app-source">
(function(){

const SUPABASE_URL = "https://zzbjucpscbjqisyqzmre.supabase.co";
const supabase = supabase_lib_placeholder;

function formatUGX(n){ if(n===null||n===undefined) return "—"; return "UGX " + Number(n).toLocaleString(); }
const { useState, useEffect, useRef } = React;

function AuthScreen({ onAuthed }){
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');

  async function handleLogin(){
    setError(''); setLoading(true);
    try{
      const { error: err } = await supabase.auth.signInWithPassword({ email, password });
      if(err) throw err;
      onAuthed();
    }catch(e){ setError(e.message || 'Could not log in.'); }
    setLoading(false);
  }

  async function handleRegister(){
    setError(''); setLoading(true);
    try{
      const { data, error: err } = await supabase.auth.signUp({ email, password });
      if(err) throw err;
      setInfo('Account created. If you have not been added as an admin yet, the dashboard will show "not authorized" until that is done in Supabase.');
      onAuthed();
    }catch(e){ setError(e.message || 'Could not create account.'); }
    setLoading(false);
  }

  return (
    <div className="app-shell" style={{maxWidth:420}}>
      <div className="topbar">
        <img className="brand-mark" src={window.MOAUTO_LOGO} alt="MoAuto" />
        <div><div className="brand-name">MoAuto</div><div className="brand-tag">Admin Dashboard</div></div>
      </div>
      <div className="card">
        <label style={{marginTop:0}}>Email</label>
        <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@example.com" />
        <label>Password</label>
        <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Password" />
        {error && <div className="error-text">{error}</div>}
        {info && <div style={{color:'var(--teal)',fontSize:13,marginTop:8}}>{info}</div>}
        <div style={{marginTop:16}}>
          <button className="btn btn-primary" disabled={loading} onClick={mode==='login' ? handleLogin : handleRegister}>
            {loading ? <span className="spinner"></span> : (mode==='login' ? 'Log in' : 'Create account')}
          </button>
        </div>
      </div>
      <div style={{textAlign:'center',marginTop:14}}>
        {mode==='login'
          ? <span className="hint">First time here? <button className="link-btn" onClick={()=>setMode('register')} style={{background:'none',border:'none',color:'var(--teal)',cursor:'pointer',fontWeight:600}}>Create account</button></span>
          : <span className="hint">Already have one? <button className="link-btn" onClick={()=>setMode('login')} style={{background:'none',border:'none',color:'var(--teal)',cursor:'pointer',fontWeight:600}}>Log in</button></span>}
      </div>
    </div>
  );
}

function SignupChart({ bounds, drivers, buyers }){
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if(!canvasRef.current || typeof Chart === 'undefined') return;
    const weeks = [];
    const now = new Date();
    for(let i=11;i>=0;i--){
      const d = new Date(now); d.setDate(d.getDate() - i*7);
      weeks.push(d);
    }
    function countPerWeek(rows){
      return weeks.map((weekStart, idx) => {
        const weekEnd = idx < weeks.length-1 ? weeks[idx+1] : new Date(now.getTime()+86400000);
        return rows.filter(r => {
          const t = new Date(r.created_at);
          return t >= weekStart && t < weekEnd;
        }).length;
      });
    }
    const labels = weeks.map(d => (d.getMonth()+1)+'/'+d.getDate());
    if(chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Bounds', data: countPerWeek(bounds), borderColor: '#0D47A1', backgroundColor: 'rgba(13,71,161,0.1)', tension: 0.3 },
          { label: 'Drivers', data: countPerWeek(drivers), borderColor: '#FFC107', backgroundColor: 'rgba(255,193,7,0.15)', tension: 0.3 },
          { label: 'Buyers', data: countPerWeek(buyers), borderColor: '#455A64', backgroundColor: 'rgba(69,90,100,0.1)', tension: 0.3 },
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, ticks:{precision:0} } } }
    });
    return () => { if(chartRef.current) chartRef.current.destroy(); };
  }, [bounds, drivers, buyers]);

  return <canvas ref={canvasRef}></canvas>;
}

function Dashboard(){
  const [loading, setLoading] = useState(true);
  const [authorized, setAuthorized] = useState(false);
  const [data, setData] = useState(null);
  const [deletingId, setDeletingId] = useState(null);

  useEffect(() => { loadAll(); }, []);

  async function loadAll(){
    setLoading(true);
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){ setLoading(false); return; }

    const { data: adminRow } = await supabase.from('admins').select('*').eq('auth_user_id', session.user.id).maybeSingle();
    if(!adminRow){ setAuthorized(false); setLoading(false); return; }
    setAuthorized(true);

    const [bounds, drivers, buyers, cars, rides, conversations, subsB, subsD, events] = await Promise.all([
      supabase.from('bounds').select('id,business_name,created_at,status'),
      supabase.from('drivers').select('id,name,vehicle_type,created_at,status'),
      supabase.from('buyers').select('id,created_at'),
      supabase.from('cars').select('id'),
      supabase.from('rides').select('id,status'),
      supabase.from('conversations').select('id'),
      supabase.from('subscriptions_bounds').select('bound_id,status,ends_at'),
      supabase.from('subscriptions_drivers').select('driver_id,status,ends_at'),
      supabase.from('analytics_events').select('app_source,created_at'),
    ]);

    setData({
      bounds: bounds.data || [], drivers: drivers.data || [], buyers: buyers.data || [],
      cars: cars.data || [], rides: rides.data || [], conversations: conversations.data || [],
      subsB: subsB.data || [], subsD: subsD.data || [], events: events.data || [],
    });
    setLoading(false);
  }

  async function handleLogout(){
    await supabase.auth.signOut();
    window.location.reload();
  }

  async function deleteBound(bound){
    if(!confirm(`Delete "${bound.business_name}"? This removes their cars, photos, and subscription history permanently. This cannot be undone.`)) return;
    const { error } = await supabase.from('bounds').delete().eq('id', bound.id);
    if(error){ alert('Failed: ' + error.message); return; }
    loadAll();
  }

  async function deleteAccount(targetType, record){
    const label = targetType === 'driver' ? record.name : `buyer ${record.id.slice(0,8)}`;
    if(!confirm(`Permanently delete this ${targetType} account (${label})? This removes their login, rides, messages, and uploaded documents. This cannot be undone.`)) return;
    setDeletingId(record.id);
    try{
      const { data: { session } } = await supabase.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-delete-account`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ targetType, targetId: record.id })
      });
      const result = await res.json();
      if(!res.ok){ alert('Failed: ' + (result.error || 'Unknown error')); setDeletingId(null); return; }
      loadAll();
    }catch(e){ alert('Failed: ' + e.message); }
    setDeletingId(null);
  }

  if(loading) return <div className="app-shell"><div className="card"><span className="spinner"></span> Loading…</div></div>;
  if(!authorized) return (
    <div className="app-shell" style={{maxWidth:420}}>
      <div className="card">
        <div style={{fontWeight:700,marginBottom:8}}>Not authorized</div>
        <div className="hint">This account isn't listed as an admin yet. Add your auth_user_id to the <code>admins</code> table in Supabase, then reload.</div>
        <button className="btn btn-primary" style={{marginTop:16}} onClick={handleLogout}>Log out</button>
      </div>
    </div>
  );

  const activeBounds = data.subsB.filter(s => s.status === 'active' && new Date(s.ends_at) > new Date());
  const activeDrivers = data.subsD.filter(s => s.status === 'active' && new Date(s.ends_at) > new Date());
  const bodaCount = data.drivers.filter(d => d.vehicle_type === 'boda').length;
  const carCount = data.drivers.filter(d => d.vehicle_type === 'car').length;
  const completedRides = data.rides.filter(r => r.status === 'completed').length;

  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7*86400000);
  const monthAgo = new Date(now.getTime() - 30*86400000);
  const sixMonthAgo = new Date(now.getTime() - 182*86400000);
  const yearAgo = new Date(now.getTime() - 365*86400000);
  function eventsSince(since){ return data.events.filter(e => new Date(e.created_at) >= since).length; }

  const boundsWithSub = data.bounds.map(b => {
    const sub = data.subsB.filter(s => s.bound_id === b.id).sort((a,z)=>new Date(z.ends_at)-new Date(a.ends_at))[0];
    return { ...b, subStatus: sub && sub.status==='active' && new Date(sub.ends_at) > now ? 'active' : 'unpaid' };
  });
  const driversWithSub = data.drivers.map(d => {
    const sub = data.subsD.filter(s => s.driver_id === d.id).sort((a,z)=>new Date(z.ends_at)-new Date(a.ends_at))[0];
    return { ...d, subStatus: sub && sub.status==='active' && new Date(sub.ends_at) > now ? 'active' : 'unpaid' };
  });

  return (
    <div className="app-shell">
      <div className="topbar" style={{justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <img className="brand-mark" src={window.MOAUTO_LOGO} alt="MoAuto" />
          <div><div className="brand-name">MoAuto</div><div className="brand-tag">Admin Dashboard</div></div>
        </div>
        <button onClick={handleLogout} style={{background:'none',border:'1px solid var(--line)',borderRadius:8,padding:'8px 14px',cursor:'pointer',color:'var(--text)',fontSize:13}}>Log out</button>
      </div>

      <div className="grid">
        <div className="stat-card"><div className="stat-value">{data.bounds.length}</div><div className="stat-label">Bounds</div></div>
        <div className="stat-card"><div className="stat-value">{data.drivers.length}</div><div className="stat-label">Drivers ({bodaCount} boda · {carCount} cab)</div></div>
        <div className="stat-card"><div className="stat-value">{data.buyers.length}</div><div className="stat-label">Buyers</div></div>
        <div className="stat-card"><div className="stat-value">{data.cars.length}</div><div className="stat-label">Cars listed</div></div>
        <div className="stat-card"><div className="stat-value">{data.rides.length}</div><div className="stat-label">Total rides ({completedRides} completed)</div></div>
        <div className="stat-card"><div className="stat-value">{data.conversations.length}</div><div className="stat-label">Conversations</div></div>
        <div className="stat-card"><div className="stat-value">{activeBounds.length}/{data.bounds.length}</div><div className="stat-label">Bounds paid & active</div></div>
        <div className="stat-card"><div className="stat-value">{activeDrivers.length}/{data.drivers.length}</div><div className="stat-label">Drivers paid & active</div></div>
      </div>

      <h2>App opens (lightweight traffic proxy)</h2>
      <div className="grid">
        <div className="stat-card"><div className="stat-value">{eventsSince(weekAgo)}</div><div className="stat-label">Last 7 days</div></div>
        <div className="stat-card"><div className="stat-value">{eventsSince(monthAgo)}</div><div className="stat-label">Last 30 days</div></div>
        <div className="stat-card"><div className="stat-value">{eventsSince(sixMonthAgo)}</div><div className="stat-label">Last 6 months</div></div>
        <div className="stat-card"><div className="stat-value">{eventsSince(yearAgo)}</div><div className="stat-label">Last year</div></div>
      </div>
      <div className="hint" style={{marginBottom:20}}>This counts app opens, not full sessions or page-by-page behavior. For real marketing/traffic analytics (sources, funnels, drop-off), connect a dedicated tool like PostHog — this number is a simple, honest starting signal.</div>

      <h2>Signups over the last 12 weeks</h2>
      <div className="chart-wrap">
        <SignupChart bounds={data.bounds} drivers={data.drivers} buyers={data.buyers} />
      </div>

      <h2>Bounds — payment status</h2>
      <div className="card" style={{overflowX:'auto'}}>
        <table>
          <thead><tr><th>Business</th><th>Status</th><th>Joined</th><th></th></tr></thead>
          <tbody>
            {boundsWithSub.map(b => (
              <tr key={b.id}>
                <td>{b.business_name}</td>
                <td><span className={"pill " + (b.subStatus==='active' ? 'pill-active' : 'pill-expired')}>{b.subStatus}</span></td>
                <td>{new Date(b.created_at).toLocaleDateString()}</td>
                <td><button onClick={()=>deleteBound(b)} style={{background:'none',border:'1px solid var(--red)',color:'var(--red)',borderRadius:6,padding:'5px 10px',fontSize:12,cursor:'pointer'}}>Delete</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h2>Drivers — payment status</h2>
      <div className="card" style={{overflowX:'auto'}}>
        <table>
          <thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Joined</th><th></th></tr></thead>
          <tbody>
            {driversWithSub.map(d => (
              <tr key={d.id}>
                <td>{d.name}</td>
                <td>{d.vehicle_type === 'car' ? '🚕 Car Cab' : '🏍️ Boda Boda'}</td>
                <td><span className={"pill " + (d.subStatus==='active' ? 'pill-active' : 'pill-expired')}>{d.subStatus}</span></td>
                <td>{new Date(d.created_at).toLocaleDateString()}</td>
                <td><button onClick={()=>deleteAccount('driver', d)} disabled={deletingId===d.id} style={{background:'none',border:'1px solid var(--red)',color:'var(--red)',borderRadius:6,padding:'5px 10px',fontSize:12,cursor:'pointer'}}>{deletingId===d.id ? '…' : 'Delete'}</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h2>Buyers</h2>
      <div className="card" style={{overflowX:'auto'}}>
        <table>
          <thead><tr><th>Buyer ID</th><th>Joined</th><th></th></tr></thead>
          <tbody>
            {data.buyers.map(b => (
              <tr key={b.id}>
                <td style={{fontFamily:'monospace',fontSize:12}}>{b.id.slice(0,8)}…</td>
                <td>{new Date(b.created_at).toLocaleDateString()}</td>
                <td><button onClick={()=>deleteAccount('buyer', b)} disabled={deletingId===b.id} style={{background:'none',border:'1px solid var(--red)',color:'var(--red)',borderRadius:6,padding:'5px 10px',fontSize:12,cursor:'pointer'}}>{deletingId===b.id ? '…' : 'Delete'}</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <h2>Marketing & Google ratings</h2>
      <div className="card">
        <div className="hint">
          These need dedicated external tools rather than custom-built numbers here:<br/><br/>
          <b>Marketing / traffic sources</b> — connect PostHog (free tier) for real attribution: which channel, campaign, or referral actually brought someone in.<br/><br/>
          <b>Google ratings</b> — requires a Google Business Profile for MoAuto, set up directly with Google, then its reviews can be linked or embedded here later.
        </div>
      </div>
    </div>
  );
}

function Root(){
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    supabase.auth.getSession().then(({data}) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if(session === undefined) return <div className="app-shell"><span className="spinner"></span></div>;
  if(!session) return <AuthScreen onAuthed={()=>{}} />;
  return <Dashboard />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
})();
